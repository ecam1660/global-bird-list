  :root {
    /* Shared site palette (same tokens as index.html / families.html) */
    --tan-dk:    #B89D80;
    --tan-lt:    #E2D3BD;
    --ink:       #2e2218;
    --ink-mid:   #5a4a38;
    --ink-light: #9a8870;
    --surface:   #fffdf9;
    --bg:        #f7f2eb;
    --border:    rgba(46,34,24,0.14);
    --shadow:    0 1px 6px rgba(46,34,24,0.10);
    --shadow-h:  0 5px 20px rgba(46,34,24,0.18);
    --teal-dk:   #435763;
    --teal-md:   #7692A2;
    --teal-lt:   #C8D3DA;
    --header-bg:   var(--teal-dk);
    --header-text: #F2F7F5;
    --header-sub:  var(--teal-lt);
    --header-line: var(--teal-lt);
    --chip-bg:     #ECE3D4;
    --chip-border: var(--tan-lt);
    --chip-text:   var(--ink-mid);
    --chip-on-bg:  var(--teal-md);
    --chip-on-text:var(--ink);
    --field-bg:    #fffefb;

    /* Life List tile defaults (frog-tile green). Every tile overrides these
       with its own order's palette — see ORDER_PAL. */
    --md:   #9EBB93;   /* tile fill */
    --lt:   #D3EACC;   /* expanded panel */
    --line: #C0D8B9;   /* hairline on panel */
    --aba:  #B5CFAA;   /* ABA pill */
    --num:  #7C9A71;   /* lifer number */
    --dk:   #648457;   /* icons */
    --ink3: #5E7B54;   /* secondary text */
    --ink2: #2E4A26;   /* main text */

    --serif: Georgia, 'Times New Roman', serif;
    --tile: 100px;
    --gap: 14px;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); color: var(--ink);
    display: flex; flex-direction: column; min-height: 100%;
  }

  /* ── STICKY TOP BAR (same as families.html) ── */
  .topbar { position: sticky; top: 0; z-index: 30; }
  @media (max-width: 699px) { .topbar { position: static; } }
  .stile { scroll-margin-top: calc(var(--topbar-h, 0px) + 12px); scroll-margin-bottom: 12px; }

  /* ── HEADER (same markup/CSS as index.html) ── */
  .header {
    background: var(--header-bg);
    padding: 14px clamp(16px, 4vw, 30px);
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    border-bottom: 3px solid var(--header-line);
  }
  .header h1 {
    margin: 0; font-family: var(--serif); font-weight: 400; font-size: 20px;
    letter-spacing: .01em; color: var(--header-sub); flex: 1; min-width: 190px;
  }
  .header h1 b { color: var(--header-text); font-weight: 400; }
  .hnav { display: flex; gap: 8px; flex-wrap: wrap; }
  .hnav-btn {
    font-size: 12px; font-weight: 600; letter-spacing: .01em;
    padding: 7px 15px; border-radius: 99px;
    border: 1px solid var(--header-line); background: rgba(255,255,255,.05);
    color: var(--header-sub); text-decoration: none; white-space: nowrap; font-variant-numeric: tabular-nums;

/* ── Helpers (same rules as index.html) ────────────────────────────────── */
function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function stripDiacritics(s){ return (s||'').normalize('NFD').replace(/[̀-ͯ]/g,''); }
function speciesSlug(s) {
  return stripDiacritics(s || '').toLowerCase().replace(/['’]/g, '').replace(/[^a-z0-9]+/g, '_').replace(/^_|_$/g, '');
}
function initials(s) {
  return (s || '').split(/[\s-]+/).filter(Boolean).slice(0, 3).map(function(w){ return w.charAt(0); }).join('').toUpperCase();
}
function ampersand(s){ return (s||'').replace(/\band\b/g, '&'); }
function cap(s){ return s.charAt(0) + s.slice(1).toLowerCase(); }
function isTrue(v){ return /^(true|yes|y|1)$/i.test((v || '').trim()); }
function num(v){ var n = parseInt((v || '').replace(/[^0-9]/g, ''), 10); return isNaN(n) ? 0 : n; }
function fmt(n){ return n.toLocaleString('en-US'); }

/* Species photo: photos/species/<slug>.jpg, tinted initials panel if missing */
function speciesPhotoHTML(name) {
  return '<img src="photos/species/' + speciesSlug(name) + '.jpg" alt="" loading="lazy" onerror="this.style.display=\'none\';this.nextElementSibling.hidden=false">'
       + '<span class="ini" hidden>' + esc(initials(name)) + '</span>';
}

/* ── CSV (same parser as families.html) ────────────────────────────────── */
function parseCSV(text) {
  var rows = [], row = [], field = '', inQuotes = false, i = 0, len = text.length;
  while (i < len) {
    var c = text.charAt(i);
    if (inQuotes) {
      if (c === '"') { if (text.charAt(i+1) === '"') { field += '"'; i += 2; continue; } inQuotes = false; i++; continue; }
      field += c; i++; continue;
    }
    if (c === '"') { inQuotes = true; i++; continue; }
    if (c === ',') { row.push(field); field = ''; i++; continue; }
    if (c === '\r') { i++; continue; }
    if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; i++; continue; }
    field += c; i++;
  }
  if (field !== '' || row.length) { row.push(field); rows.push(row); }
  return rows;
}
function csvRowsToRecords(rows) {
  if (!rows.length) return [];
  var header = rows[0].map(function(h){ return h.replace(/^﻿/, '').trim(); }), out = [];
  for (var r = 1; r < rows.length; r++) {
    var cells = rows[r];
    if (cells.length === 1 && cells[0] === '') continue;
    var rec = {};
    for (var c = 0; c < header.length; c++) rec[header[c]] = cells[c] !== undefined ? cells[c] : '';
    out.push(rec);
  }
  return out;
}
function isSeenDate(v) {
  v = (v || '').trim();
  return !!v && !/^#?n\/?a$/i.test(v);
}
/* Life list date is M/D/YYYY from the sheet; also accepts YYYY-MM-DD. Returns a sortable number. */
function dateKey(v) {
  v = (v || '').trim();
  var m = v.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})$/);
  if (m) { var y = +m[3]; if (y < 100) y += 2000; return y * 10000 + (+m[1]) * 100 + (+m[2]); }
  m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
  if (m) return (+m[1]) * 10000 + (+m[2]) * 100 + (+m[3]);
  var t = Date.parse(v);
  if (!isNaN(t)) { var d = new Date(t); return d.getFullYear() * 10000 + (d.getMonth()+1) * 100 + d.getDate(); }
  return 99999999;
}
/* 20221115 -> "11/15/22" */
function shortDate(k) {
  if (k === 99999999) return '';
  return Math.floor(k / 100) % 100 + '/' + k % 100 + '/' + String(Math.floor(k / 10000)).slice(2);
}
function col(rec, name) {
  if (name in rec) return rec[name];
  var lk = name.toLowerCase();
  for (var k in rec) if (k.toLowerCase() === lk) return rec[k];
  return '';
}

/* One entry per seen species. Lifer # = order of first sighting; species
   first seen on the same day are numbered in taxonomic (ID) order. */
/* Resolves a logical column to whatever its header is in this birddata.csv
   (headers have been renamed between exports: "Life list date" -> "LL DATE",
   "World Obs (Oct 2025)" -> "GLOBAL OBS", ...). Candidates are tried
   case-insensitively, in order; null if none is present. Same idea as
   resolveColumn() in families.html / index.html. */
function resolveColumn(records, candidates) {
  if (!records.length) return null;
  var keys = Object.keys(records[0]);
  for (var i = 0; i < candidates.length; i++) {
    var want = candidates[i].trim().toUpperCase();
    for (var j = 0; j < keys.length; j++) if (keys[j].trim().toUpperCase() === want) return keys[j];
  }
  return null;
}
var K = {};   /* logical column -> header, filled by buildLifers */
function get(rec, key) { return key ? (rec[key] || '') : ''; }

/* one subspecies row → { e: epithet, nm: SSP NAME, t: 'M' | 'P' | '', st: 1 ✓ / 2 ? / 0, rg, ex, gd, lk } */
function sspFrom(rec) {
  var sci = get(rec, K.sci).trim().split(/\s+/), seen = get(rec, K.sspSeen).trim().toLowerCase();
  var type = get(rec, K.sspType).trim().toLowerCase();
  var link = (rec['LINK'] || '').trim();   /* the second LINK column (observation URL) wins in the parsed record */
  return {
    e: sci.slice(2).join(' ') || sci.join(' '),
    nm: get(rec, K.sspName).trim(),
    t: type === 'monotypic' ? 'M' : type === 'polytypic' ? 'P' : '',
    st: seen === 'yes' ? 1 : seen === 'maybe' ? 2 : 0,
    rg: get(rec, K.range).trim(),
    ex: get(rec, K.iucn).trim().toUpperCase() === 'EX',
    gd: get(rec, K.geo).trim().toLowerCase() === 'yes',
    lk: /^https?:\/\//i.test(link) ? link : ''
  };
}

function buildLifers(records) {
  var ordSeen = {}, ords = [], out = [];
  K = {
    id:      resolveColumn(records, ['ID']),
    rank:    resolveColumn(records, ['RANK']),
    order:   resolveColumn(records, ['ORDER']),
    family:  resolveColumn(records, ['FAMILY']),
    famName: resolveColumn(records, ['FAMILY NAME']),
    common:  resolveColumn(records, ['COMMON NAME']),
    sci:     resolveColumn(records, ['SCIENTIFIC NAME']),
    iucn:    resolveColumn(records, ['IUCN', 'IUCN Status']),
    aba:     resolveColumn(records, ['ABA STATUS']),
    date:    resolveColumn(records, ['LL DATE', 'Life list date']),
    loc:     resolveColumn(records, ['LL LOCATION', 'Life list location']),
    world:   resolveColumn(records, ['GLOBAL OBS', 'World Obs (Oct 2025)']),
    us:      resolveColumn(records, ['US OBS', 'US Obs (Oct 2025)']),
    nssp:    resolveColumn(records, ['# SSP']),
    sspType: resolveColumn(records, ['SSP TYPE']),
    sspName: resolveColumn(records, ['SSP NAME']),
    sspSeen: resolveColumn(records, ['SSP SEEN?']),
    range:   resolveColumn(records, ['SHORT RANGE']),
    geo:     resolveColumn(records, ['GEO DISTINCT']),
    first:   resolveColumn(records, ['FIRST SIGHTING']),   /* short place name, e.g. "Hanalei NWR"; optional */
    photo:   resolveColumn(records, ['PHOTO']),   /* null until Photo/Audio are re-added; the filters and icons hide meanwhile */
    audio:   resolveColumn(records, ['AUDIO'])
  };
  PLACES.forEach(function(p){ p.col = resolveColumn(records, [p.k]); });
  var cur = null;   /* the lifer the following subspecies rows belong to (null if that species isn't a lifer) */
  records.forEach(function(rec) {
    /* Subspecies rows sit right after their species row; they feed the Subspecies tab */
    if (K.rank && get(rec, K.rank).trim().toLowerCase() === 'subspecies') {
      if (cur) cur.ssp.push(sspFrom(rec));
      return;
    }
    cur = null;
    /* species rows only; RANK may be absent in an older CSV, where every row is a species */
    if (K.rank && get(rec, K.rank).trim().toLowerCase() !== 'species') return;
    var id = parseInt(get(rec, K.id), 10), ord = get(rec, K.order).trim();
    if (ord && !ordSeen[ord]) { ordSeen[ord] = { order: ord, id: isNaN(id) ? 1e9 : id }; ords.push(ordSeen[ord]); }
    else if (ord && !isNaN(id) && id < ordSeen[ord].id) ordSeen[ord].id = id;
    if (!isSeenDate(get(rec, K.date))) return;
    var aba = (get(rec, K.aba).match(/ABA\s*([1-4])\b/i) || [])[1] || '';
    out.push(cur = {
      id: isNaN(id) ? 1e9 : id,
      name: get(rec, K.common).trim(),
      sci: get(rec, K.sci).trim(),
      order: ord,
      orderCommon: ORDER_COMMON[ord] || cap(ord),
      fam: get(rec, K.family).trim(),
      famName: ampersand(get(rec, K.famName).trim()),
      loc: get(rec, K.loc).trim().replace(/^#N\/A$/i, '').replace(/-$/, ''),   /* "SG-" (no sub-region) shows as "SG" */
      key: dateKey(get(rec, K.date)),
      iucn: get(rec, K.iucn).trim().toUpperCase(),
      aba: aba,
      world: num(get(rec, K.world)),
      us: num(get(rec, K.us)),
      seen: PLACES.reduce(function(m, p){ if (isTrue(get(rec, p.col))) m[p.k] = 1; return m; }, {}),
      photo: isTrue(get(rec, K.photo)),
      audio: isTrue(get(rec, K.audio)),
      dateFull: get(rec, K.date).trim(),
      firstSighting: get(rec, K.first).trim().replace(/^#N\/A$/i, ''),
      nssp: num(get(rec, K.nssp)),
      ssp: []
    });
  });
  out.forEach(function(s){ for (var k in s.seen) PLACE[k].n++; });
  out.sort(function(a, b){ return a.key - b.key || a.id - b.id; });
  out.forEach(function(s, i){
    s.n = i + 1;
    s.first = firstPlace(s.loc);
    s.hay = [s.name, s.sci, s.fam, s.famName, s.order, s.orderCommon].join(' | ').toLowerCase();
    s.hay = stripDiacritics(s.hay);
  });
  ords.sort(function(a, b){ return a.id - b.id; });
  ords.forEach(function(o){ o.code = ORDER_CODE[o.order] || o.order.slice(0, 3); });
  return { lifers: out, orders: ords };
}

function palVars(ord) {

}
function passesFilters(s) {
  if (PHOTO === 'yes' && !s.photo) return false;
  if (PHOTO === 'no' && s.photo) return false;
  if (AUDIO === 'yes' && !s.audio) return false;
  if (AUDIO === 'no' && s.audio) return false;
  if (CSEL.length) {   /* country/region columns = Yes */
    var hit = CMODE === 'all' ? CSEL.every(function(k){ return s.seen[k]; }) : CSEL.some(function(k){ return s.seen[k]; });
    if (!hit) return false;

  return !q || s.hay.indexOf(q) >= 0;
}

function topHTML(s) {

function firstPlace(loc) {

  if (!m) return null;
  if (m[1] === 'US' && m[2] && SHAPES.state[m[2]]) return { cc: 'US', shape: SHAPES.state[m[2]], name: SHAPES.names[m[2]] };

function siteName(u){ return /inaturalist/i.test(u) ? 'iNaturalist' : /ebird/i.test(u) ? 'eBird' : 'the observation'; }
function lkAttrs(x){ return ' href="' + esc(x.lk) + '" target="_blank" rel="noopener" title="Open on ' + siteName(x.lk) + '"'; }
function ckHTML(x, st) {
  if (x && x.ex) return '<span class="ck x" title="Extinct"></span>';
  var cls = 'ck' + (st === 1 ? ' y' : st === 2 ? ' q' : '');
  return x && x.lk ? '<a class="' + cls + '"' + lkAttrs(x) + '>' + CHECK + '</a>' : '<span class="' + cls + '">' + CHECK + '</span>';

function tagHTML(t){ return t === 'M' ? '<span class="tg" title="Monotypic">M</span>' : t === 'P' ? '<span class="tg" title="Polytypic group">P</span>' : ''; }

  var name = kid || !x.nm ? '<span class="lc">' + esc(x.e) + '</span>'
           : '<span class="nm">' + esc(x.nm) + '</span> <span class="ep">(' + esc(x.e) + ')</span>';
  return '<div class="sr' + (x.ex ? ' ex' : '') + '">' + ckHTML(x, x.st) + '<div><div>' + name + (kid ? '' : tagHTML(x.t))

function sspHTML(s) {
  /* polytypic subspecies are grouped under their SSP NAME; a group's box is ✓ if any member is ✓,
     else ? if any is ?, ignoring extinct members */
  var groups = {}, out = [];
  s.ssp.forEach(function(x){
    if (x.t === 'P' && x.nm) {
      if (!groups[x.nm]) { groups[x.nm] = { nm: x.nm, kids: [] }; out.push(groups[x.nm]); }
      groups[x.nm].kids.push(x);
    } else out.push(x);
  });
  return '<div class="slist">' + out.map(function(it){
    if (!it.kids) return sspRowHTML(it);
    var st = 0; it.kids.forEach(function(x){ if (x.ex) return; if (x.st === 1) st = 1; else if (x.st === 2 && st !== 1) st = 2; });
    return '<div class="sg"><div class="sr">' + ckHTML(null, st).replace('class="ck', 'title="Set from its subspecies" class="ck') + '<div><div><span class="nm">' + esc(it.nm) + '</span>' + tagHTML('P') + '</div></div></div>'
      + '<div class="kids">' + it.kids.map(function(x){ return sspRowHTML(x, true); }).join('') + '</div></div>';
  }).join('') + '</div>';

  var hasSsp = s.ssp.length > 0, t = hasSsp && TAB === 'ssp' ? 'ssp' : 'det';

    + '<button class="xtab' + (t === 'det' ? ' on' : '') + '" data-xtab="det">Overview</button>'
    + (hasSsp ? '<button class="xtab' + (t === 'ssp' ? ' on' : '') + '" data-xtab="ssp">Subspecies<span class="tcount">' + (s.nssp || s.ssp.length) + '</span></button>' : '')
    + '</div>' + (t === 'ssp' ? sspHTML(s) : overviewHTML(s)) + '</div>';

  document.querySelectorAll('.slist').forEach(function(l){

function sorted(list) {
  if (SORT === 'latest') return list.slice().reverse();
  if (SORT === 'obsdesc') return list.slice().sort(function(a, b){ return b.world - a.world || a.n - b.n; });
  if (SORT === 'obsasc') return list.slice().sort(function(a, b){ return a.world - b.world || a.n - b.n; });
  if (SORT === 'taxo' || SORT === 'taxodiv') return list.slice().sort(function(a, b){ return a.id - b.id; });   /* birddata.csv ID = taxonomic order */
  return list;   /* LIFERS is already in first-observed order */
}

function render() {
  var inView = LIFERS.filter(passesFilters);
  var list = orderSelCount() ? inView.filter(function(s){ return ORDER_SEL[s.order]; }) : inView;
  list = sorted(list);
  if (OPEN && !list.some(function(s){ return s.n === OPEN; })) OPEN = null;
  updateStrip(inView);
  document.getElementById('count').innerHTML = list.length === LIFERS.length
    ? '<b>' + fmt(LIFERS.length) + '</b> lifers'
    : '<b>' + fmt(list.length) + '</b> of ' + fmt(LIFERS.length);

  var savedScrollY = window.scrollY;
  var grid = document.getElementById('grid');
  var div = SORT === 'taxodiv' && list.length > 0;
  grid.className = 'grid' + (div ? ' divided' : '');
  grid.innerHTML = div ? dividedHTML(list) : list.length
    ? list.map(tileHTML).join('')
    : '<div class="empty-state">No lifers match these filters.</div>';
  window.scrollTo(0, savedScrollY);
  markScroll();
}

/* Open/close without rebuilding the grid, so scroll position never jumps. */
function toggle(n) {
  var grid = document.getElementById('grid');
  var prev = OPEN && grid.querySelector('.stile[data-n="' + OPEN + '"]');
  if (prev) { prev.classList.remove('open'); prev.setAttribute('aria-expanded', 'false'); var b = prev.querySelector('.xp'); if (b) b.remove(); }
  OPEN = (OPEN === n) ? null : n;
  TAB = 'det';
  var el = OPEN && grid.querySelector('.stile[data-n="' + OPEN + '"]');
  if (el) {
    el.classList.add('open'); el.setAttribute('aria-expanded', 'true');
    el.insertAdjacentHTML('beforeend', panelHTML(BY_N[OPEN]));
    markScroll();
    el.focus({ preventScroll: true });
    requestAnimationFrame(function() {
      var top = setTopbarVar();
      var r = el.getBoundingClientRect();
      if (r.top < top || r.bottom > window.innerHeight) el.scrollIntoView({ block: 'nearest' });
    });
  }
  updateStrip(null);
}

function setTopbarVar() {
  var t = document.querySelector('.topbar');
  var h = (t && getComputedStyle(t).position === 'sticky') ? t.getBoundingClientRect().height : 0;
  document.documentElement.style.setProperty('--topbar-h', h + 'px');
  return h;
}

/* ── Order strip ───────────────────────────────────────────────────────── */
function buildStrip() {
  var strip = document.getElementById('ostrip');
  strip.innerHTML = ORDERS.map(function(o) {
    var p = ORDER_PAL[o.order] || { md: '#9EBB93', ink2: '#2E4A26' };
    return '<button class="obtn" data-order="' + esc(o.order) + '" aria-label="' + esc(cap(o.order)) + '"'
         + ' style="--obg:' + p.md + ';--oink:' + p.ink2 + '">' + esc(o.code) + '</button>';
  }).join('');
  strip.addEventListener('click', function(e) {
    var b = e.target.closest('.obtn');
    if (!b) return;
    var ord = b.dataset.order;
    if (ORDER_SEL[ord]) delete ORDER_SEL[ord]; else ORDER_SEL[ord] = true;
    render();
  });
}
var LAST_PRESENT = {};
function updateStrip(inView) {
  if (inView) { LAST_PRESENT = {}; inView.forEach(function(s){ LAST_PRESENT[s.order] = true; }); }
  var openOrd = OPEN && BY_N[OPEN] ? BY_N[OPEN].order : null;
  document.querySelectorAll('.obtn').forEach(function(b) {
    var ord = b.dataset.order;
    b.classList.toggle('on', !!ORDER_SEL[ord]);
    b.classList.toggle('expanded', openOrd === ord);
    b.classList.toggle('dim', !LAST_PRESENT[ord]);
    b.setAttribute('aria-pressed', ORDER_SEL[ord] ? 'true' : 'false');
  });
  var clr = document.getElementById('oclear');
  clr.classList.toggle('active', orderSelCount() > 0);
  clr.disabled = orderSelCount() === 0;
}

/* ── Data load ─────────────────────────────────────────────────────────── */
function showDataMessage(msg) {
  document.getElementById('grid').innerHTML = '<div class="empty-state">' + esc(msg) + '</div>';
}
function loadData() {
  showDataMessage('Loading bird data…');
  fetch('birddata.csv')
    .then(function(resp) { if (!resp.ok) throw new Error('HTTP ' + resp.status); return resp.text(); })
    .then(function(text) {
      var built = buildLifers(csvRowsToRecords(parseCSV(text)));
      LIFERS = built.lifers;
      ORDERS = built.orders;
      LIFERS.forEach(function(s){ BY_N[s.n] = s; });
      /* hide the photo / audio filters while birddata.csv has no Photo / Audio column */
      ['photo', 'audio'].forEach(function(g){
        if (!K[g]) document.querySelectorAll('[data-g="' + g + '"]').forEach(function(el){ el.hidden = true; });
      });
      buildStrip();
      render();
    })
    .catch(function(err) {
      showDataMessage('Could not load birddata.csv (' + err.message + '). Make sure it sits in the same folder as life-list.html.');
    });
}

(function init() {
  var chips = document.querySelectorAll('.chip[data-f]');
  function syncChips() {
    chips.forEach(function(b) {
      var f = b.dataset.f;
      b.classList.toggle('on', f === 'all' ? (PHOTO === 'any' && AUDIO === 'any' && !CSEL.length)
                              : f === 'photo' ? PHOTO === b.dataset.v : AUDIO === b.dataset.v);
    });
  }
  chips.forEach(function(btn) {
    btn.addEventListener('click', function() {
      var f = btn.dataset.f, v = btn.dataset.v;
      if (f === 'all') { PHOTO = 'any'; AUDIO = 'any'; CSEL = []; renderPills(); }
      else if (f === 'photo') PHOTO = (PHOTO === v ? 'any' : v);
      else AUDIO = (AUDIO === v ? 'any' : v);
      syncChips();
      render();
    });
  });
  /* ── Seen-in picker ── */
  var cadd = document.getElementById('cadd'), cdrop = document.getElementById('cdrop'),
      csearch = document.getElementById('csearch'), clist = document.getElementById('clist'),
      cpills = document.getElementById('cpills'), HI = 0, SHOWN = [];
  function matches(p, q) {
    if (!q) return true;
    var hay = stripDiacritics((p.name + ' ' + (p.alt || '')).toLowerCase());
    return p.k.toLowerCase() === q || hay.split(/\s+/).some(function(w){ return w.indexOf(q) === 0; }) || hay.indexOf(q) === 0;
  }
  function renderList() {
    var q = stripDiacritics(csearch.value.toLowerCase().trim());
    SHOWN = PLACES.filter(function(p){ return p.n > 0 && matches(p, q); });   /* places with no lifers (an empty or missing column) stay out of the list */
    if (HI >= SHOWN.length) HI = Math.max(0, SHOWN.length - 1);
    var html = '', grp = false;
    SHOWN.forEach(function(p, i){
      if (p.kind === 'region' && !grp) { grp = true; html += '<div class="cgrp">Regions</div>'; }
      var on = CSEL.indexOf(p.k) >= 0;
      html += '<div class="copt' + (on ? ' sel' : '') + (i === HI ? ' hi' : '') + '" role="option" aria-selected="' + on + '" data-k="' + p.k + '" data-i="' + i + '">'
        + '<span class="bx"></span><span>' + p.name + (p.kind ? '' : '<span class="cc">' + p.k + '</span>') + '</span><span class="ct">' + fmt(p.n) + '</span></div>';
    });
    clist.innerHTML = html || '<div class="cnone">No matches</div>';
    var h = clist.querySelector('.hi'); if (h) h.scrollIntoView({ block: 'nearest' });
  }
  function renderPills() {
    cpills.innerHTML = CSEL.map(function(k){
      return '<span class="cpill">' + PLACE[k].name + '<button data-k="' + k + '" aria-label="Remove ' + PLACE[k].name + '" title="Remove">×</button></span>';
    }).join('') + (CSEL.length > 1 ? '<span class="cmode" title="Seen in any of these, or in all of them"><button data-m="any"' + (CMODE === 'any' ? ' class="on"' : '') + '>Any</button><button data-m="all"' + (CMODE === 'all' ? ' class="on"' : '') + '>All</button></span>' : '');
  }
  function togglePlace(k) {
    var i = CSEL.indexOf(k);
    if (i >= 0) CSEL.splice(i, 1); else CSEL.push(k);
    renderPills(); syncChips(); render();
  }
  function openDrop() { cdrop.hidden = false; cadd.setAttribute('aria-expanded', 'true'); csearch.value = ''; HI = 0; renderList(); csearch.focus(); }
  function closeDrop() { cdrop.hidden = true; cadd.setAttribute('aria-expanded', 'false'); }
  cadd.addEventListener('click', function(){ cdrop.hidden ? openDrop() : closeDrop(); });
  csearch.addEventListener('input', function(){ HI = 0; renderList(); });
  csearch.addEventListener('keydown', function(e){
    if (e.key === 'ArrowDown') { e.preventDefault(); HI = Math.min(HI + 1, SHOWN.length - 1); renderList(); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); HI = Math.max(HI - 1, 0); renderList(); }
    else if (e.key === 'Enter') { e.preventDefault(); if (SHOWN[HI]) { togglePlace(SHOWN[HI].k); csearch.value = ''; renderList(); } }
    else if (e.key === 'Escape') { closeDrop(); cadd.focus(); }
  });
  clist.addEventListener('mousedown', function(e){ e.preventDefault(); });   /* keep focus in the search box */
  clist.addEventListener('click', function(e){
    var o = e.target.closest('.copt'); if (!o) return;
    HI = +o.dataset.i; togglePlace(o.dataset.k); renderList();
  });
  cpills.addEventListener('click', function(e){
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.k) { togglePlace(b.dataset.k); if (!cdrop.hidden) renderList(); }
    else if (b.dataset.m) { CMODE = b.dataset.m; renderPills(); render(); }
  });
  document.addEventListener('mousedown', function(e){ if (!cdrop.hidden && !e.target.closest('#cpick, #cpills')) closeDrop(); });

  document.getElementById('sort-sel').addEventListener('change', function(){ SORT = this.value; render(); });
  var t;
  document.getElementById('search').addEventListener('input', function(){
    var v = this.value; clearTimeout(t); t = setTimeout(function(){ QUERY = v; render(); }, 90);
  });
  document.getElementById('oclear').addEventListener('click', function(){ ORDER_SEL = {}; render(); });
  var grid = document.getElementById('grid');
  grid.addEventListener('click', function(e) {
    var el = e.target.closest('.stile');
    if (!el) return;
    var n = +el.dataset.n;
    var tb = e.target.closest('[data-xtab]');
    if (tb) { if (TAB !== tb.dataset.xtab) { TAB = tb.dataset.xtab; refreshPanel(); } return; }
    if (!e.target.closest('.ph')) return;   /* only the square photo opens/closes the tile */
    toggle(n);
  });
  grid.addEventListener('keydown', function(e) {
    if (!e.target.classList.contains('stile')) return;
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(+e.target.dataset.n); }
  });
  window.addEventListener('resize', setTopbarVar);
  setTopbarVar();
  loadData();
})();
</script>
